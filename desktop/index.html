<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperLens 启动器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>PaperLens</h1>
          <p>论文精读 + 知识图谱</p>
        </div>
      </div>
      <span id="status-pill" class="pill">未启动</span>
    </header>

    <main>
      <section class="card status-card">
        <div class="status-line">
          <span id="dot" class="dot"></span>
          <strong id="status-text">服务未启动</strong>
        </div>
        <p class="url" id="url">http://127.0.0.1:5173/</p>

        <div class="actions">
          <button id="btn-start" class="btn primary" type="button">启动服务</button>
          <button id="btn-stop" class="btn" type="button">停止</button>
          <button id="btn-open" class="btn ghost" type="button">打开页面</button>
        </div>
        <p class="hint" id="message"></p>
      </section>

      <section class="card meta-card">
        <div class="meta-row">
          <span class="meta-label">数据目录</span>
          <code id="data-dir">—</code>
        </div>
        <button id="btn-open-data" class="link" type="button">打开数据目录</button>
      </section>

      <section class="card log-card">
        <div class="log-head">
          <strong>服务日志</strong>
          <button id="btn-clear-log" class="link" type="button">清空</button>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <footer>关闭窗口会停止由启动器启动的服务；数据保存在本机，不会上传。</footer>

    <script src="renderer.js"></script>
  </body>
</html>
